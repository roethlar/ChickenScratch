[package]
name = "chickenscratch"
version = "1.0.0"
edition = "2021"
description = "ChickenScratch — cross-platform writing app"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chickenscratch-core = { path = "../crates/core" }
chickenscratch-services = { path = "../crates/services" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rfd = "0.15"
