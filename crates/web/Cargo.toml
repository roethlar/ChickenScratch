[package]
name = "chickenscratch-web"
version = "1.0.0"
edition = "2021"
description = "chikn-web — self-hosted web shell serving the ChickenScratch UI over HTTP"
license = "MIT"

[[bin]]
name = "chikn-web"
path = "src/main.rs"

[dependencies]
chickenscratch-services = { path = "../services" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
toml = "0.9"
tempfile = "3.27.0"
rust-embed = { version = "8", optional = true }

[features]
# Compile ui/dist into the binary so one file can be copied to the host.
# Off by default so `cargo test` needs no UI build; release builds opt in.
embed-ui = ["dep:rust-embed"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
