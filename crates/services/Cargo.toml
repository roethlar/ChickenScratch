[package]
name = "chickenscratch-services"
version = "1.0.0"
edition = "2021"
description = "Application services shared by the ChickenScratch shells (desktop, web)"
license = "MIT"

[dependencies]
chickenscratch-core = { path = "../core" }
chikn-converter = { path = "../cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
keyring = { version = "3.6.3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }

[dev-dependencies]
# Re-declare core with the test-only fixture surface (feature unification
# turns it on for this crate's tests without touching release builds).
chickenscratch-core = { path = "../core", features = ["test-support"] }
tempfile = "3.27.0"
# Same version as chickenscratch-core: the command-boundary tests inspect
# repository state (MERGE_HEAD, merge-commit parents) directly.
git2 = "0.19"
